# Password policy
ram_password_policy_enabled: true
ram_password_min_length: 12
ram_password_require_lowercase: true
ram_password_require_uppercase: true
ram_password_require_numbers: true
ram_password_require_symbols: true
ram_password_max_age: 90
ram_password_history_count: 5

# MFA
ram_enforce_mfa: false
