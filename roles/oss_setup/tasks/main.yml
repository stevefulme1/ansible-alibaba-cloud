---
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - oss_bucket_name is defined and oss_bucket_name | length > 0
    fail_msg: "Required variable: oss_bucket_name"

- name: Configure OSS bucket
  block:
    - name: Create OSS bucket
      stevefulme1.alibaba_cloud.oss_bucket:
        bucket: "{{ oss_bucket_name }}"
        acl: "{{ oss_acl }}"
        storage_class: "{{ oss_storage_class }}"
        region: "{{ oss_region }}"
        state: "{{ oss_state }}"
        tags: "{{ oss_tags }}"
      register: _oss_bucket

    - name: Configure bucket versioning
      stevefulme1.alibaba_cloud.oss_bucket:
        bucket: "{{ oss_bucket_name }}"
        versioning: "{{ 'Enabled' if oss_versioning else 'Suspended' }}"
        region: "{{ oss_region }}"
        state: present

    - name: Configure server-side encryption
      stevefulme1.alibaba_cloud.oss_bucket:
        bucket: "{{ oss_bucket_name }}"
        encryption_rule:
          sse_algorithm: "{{ oss_encryption_algorithm }}"
        region: "{{ oss_region }}"
        state: present
      when: oss_encryption_enabled

    - name: Configure bucket logging
      stevefulme1.alibaba_cloud.oss_bucket:
        bucket: "{{ oss_bucket_name }}"
        logging:
          target_bucket: "{{ oss_logging_target_bucket }}"
          target_prefix: "{{ oss_logging_prefix }}"
        region: "{{ oss_region }}"
        state: present
      when:
        - oss_logging_enabled
        - oss_logging_target_bucket | length > 0

    - name: Configure lifecycle rules
      stevefulme1.alibaba_cloud.oss_bucket:
        bucket: "{{ oss_bucket_name }}"
        lifecycle:
          - name: "{{ item.name }}"
            prefix: "{{ item.prefix }}"
            status: "{{ item.status | default('Enabled') }}"
            expiration:
              days: "{{ item.expiration_days | default(omit) }}"
            transition:
              days: "{{ item.transition_days | default(omit) }}"
              storage_class: "{{ item.transition_storage_class | default(omit) }}"
        region: "{{ oss_region }}"
        state: present
      loop: "{{ oss_lifecycle_rules }}"
      loop_control:
        label: "{{ item.name }}"
      when: oss_lifecycle_rules | length > 0

    - name: Configure CORS rules
      stevefulme1.alibaba_cloud.oss_bucket:
        bucket: "{{ oss_bucket_name }}"
        cors:
          - allowed_origins: "{{ item.allowed_origins }}"
            allowed_methods: "{{ item.allowed_methods }}"
            allowed_headers: "{{ item.allowed_headers | default(['*']) }}"
            max_age_seconds: "{{ item.max_age_seconds | default(3600) }}"
        region: "{{ oss_region }}"
        state: present
      loop: "{{ oss_cors_rules }}"
      loop_control:
        label: "{{ item.allowed_origins | join(',') }}"
      when: oss_cors_rules | length > 0

  rescue:
    - name: Report OSS setup failure
      ansible.builtin.fail:
        msg: >-
          OSS bucket setup failed for '{{ oss_bucket_name }}'.
          Error: {{ ansible_failed_result.msg | default('Unknown error') }}
