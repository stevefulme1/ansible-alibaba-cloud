---
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core ansible-lint ruff
      - run: ruff check plugins/ tests/
      - run: ruff format --check plugins/ tests/
      - run: ansible-galaxy collection install ansible.windows community.windows 2>/dev/null || true
      - run: ansible-lint --profile production

  sanity:
    name: Sanity (${{ matrix.ansible }} / py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ansible: "2.16"
            python: "3.12"
          - ansible: "2.17"
            python: "3.12"
          - ansible: "2.18"
            python: "3.12"
          - ansible: "2.18"
            python: "3.13"
          - ansible: "2.20"
            python: "3.12"
          - ansible: "2.20"
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/stevefulme1/alibaba_cloud
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "ansible-core~=${{ matrix.ansible }}.0"
      - name: Run sanity tests
        working-directory: ansible_collections/stevefulme1/alibaba_cloud
        run: ansible-test sanity --python ${{ matrix.python }} -v --color yes

  unit:
    name: Unit tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/stevefulme1/alibaba_cloud
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ansible-core pytest pytest-cov
      - name: Run unit tests
        working-directory: ansible_collections/stevefulme1/alibaba_cloud
        run: >-
          python -m pytest tests/unit/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

  integration:
    name: Integration (mock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible_collections/stevefulme1/alibaba_cloud
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core
      - name: Run integration tests
        working-directory: ansible_collections/stevefulme1/alibaba_cloud
        run: >-
          ansible-test integration --python 3.12 -v --color yes
          --allow-unsupported
        continue-on-error: true

  auto-merge:
    name: Auto-merge owner PRs
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' &&
      github.actor == 'stevefulme1'
    needs: [lint, sanity, unit]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: hmarr/auto-approve-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
