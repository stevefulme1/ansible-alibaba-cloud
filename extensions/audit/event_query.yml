---
# extensions/audit/event_query.yml
# Indirect Node Counting query for stevefulme1.alibaba_cloud
stevefulme1.alibaba_cloud.ecs_instance:
  query: >-
    {
      name: .ecs_instance.InstanceName,
      canonical_facts: {
        uuid: .ecs_instance.InstanceId
      },
      facts: {
        device_type: "virtual_machine"
      }
    }

