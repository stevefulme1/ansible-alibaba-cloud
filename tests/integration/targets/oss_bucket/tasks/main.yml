---
# Integration tests for stevefulme1.alibaba_cloud.oss_bucket
# These tests require valid credentials configured in integration_config.yml

- name: Create oss_bucket (check_mode)
  stevefulme1.alibaba_cloud.oss_bucket:
    access_key: "{{ alibaba_cloud_access_key }}"
    secret_key: "{{ alibaba_cloud_secret_key }}"
    region: "{{ alibaba_cloud_region }}"
    state: present
    name: "ansible-test-{{ resource_prefix }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  check_mode: true
  register: check_result

- name: Verify check_mode reports changed
  ansible.builtin.assert:
    that:
      - check_result is changed

- name: Create oss_bucket
  stevefulme1.alibaba_cloud.oss_bucket:
    access_key: "{{ alibaba_cloud_access_key }}"
    secret_key: "{{ alibaba_cloud_secret_key }}"
    region: "{{ alibaba_cloud_region }}"
    state: present
    name: "ansible-test-{{ resource_prefix }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: create_result

- name: Verify oss_bucket was created
  ansible.builtin.assert:
    that:
      - create_result is changed
      - create_result.oss_bucket is defined

- name: Create oss_bucket again (idempotency)
  stevefulme1.alibaba_cloud.oss_bucket:
    access_key: "{{ alibaba_cloud_access_key }}"
    secret_key: "{{ alibaba_cloud_secret_key }}"
    region: "{{ alibaba_cloud_region }}"
    state: present
    name: "ansible-test-{{ resource_prefix }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: idem_result

- name: Verify idempotent create
  ansible.builtin.assert:
    that:
      - idem_result is not changed

- name: Delete oss_bucket (check_mode)
  stevefulme1.alibaba_cloud.oss_bucket:
    access_key: "{{ alibaba_cloud_access_key }}"
    secret_key: "{{ alibaba_cloud_secret_key }}"
    region: "{{ alibaba_cloud_region }}"
    state: absent
    name: "ansible-test-{{ resource_prefix }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  check_mode: true
  register: delete_check

- name: Verify check_mode delete reports changed
  ansible.builtin.assert:
    that:
      - delete_check is changed

- name: Delete oss_bucket
  stevefulme1.alibaba_cloud.oss_bucket:
    access_key: "{{ alibaba_cloud_access_key }}"
    secret_key: "{{ alibaba_cloud_secret_key }}"
    region: "{{ alibaba_cloud_region }}"
    state: absent
    name: "ansible-test-{{ resource_prefix }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: delete_result

- name: Verify oss_bucket was deleted
  ansible.builtin.assert:
    that:
      - delete_result is changed

- name: Delete oss_bucket again (idempotent)
  stevefulme1.alibaba_cloud.oss_bucket:
    access_key: "{{ alibaba_cloud_access_key }}"
    secret_key: "{{ alibaba_cloud_secret_key }}"
    region: "{{ alibaba_cloud_region }}"
    state: absent
    name: "ansible-test-{{ resource_prefix }}"
    validate_certs: "{{ validate_certs | default(true) }}"
  register: delete_idem

- name: Verify idempotent delete
  ansible.builtin.assert:
    that:
      - delete_idem is not changed
